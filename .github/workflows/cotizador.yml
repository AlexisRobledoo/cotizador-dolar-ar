# =========================================================
# Ejecuta el cotizador cada hora en los servidores de GitHub,
# guarda las cotizaciones nuevas en historico.csv y las sube al repo.
# Así el dashboard online se actualiza solo, aunque tu compu esté apagada.
# =========================================================
name: Actualizar cotizaciones

on:
  schedule:
    - cron: "7 * * * *"     # cada hora, en el minuto 7 (hora UTC)
  workflow_dispatch:         # botón para ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write            # permiso para hacer commit y push del CSV

jobs:
  cotizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el cotizador
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cotizador.py

      - name: Guardar los datos nuevos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.csv
          git diff --staged --quiet || git commit -m "Actualiza cotizaciones $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M')"
          git push
